contract:
  sample_rate: 44100
  channels: 1
  pcm_dtype: float32
  batch_size: 1
  text_tokens: 128
  text_normalization: NFKD + upstream symbol/whitespace handling + language tags
  text_offset_unit: Unicode scalar index in normalized text; original text is retained
    separately
  oversized_text: reject; never truncate
  unknown_character: reject; never wrap to uint16 or submit a negative token
  latent_channels: 144
  samples_per_latent: 3072
  latent_buckets:
  - 96
  vocoder_latent_range:
  - 4
  - 96
  default_steps: 8
  default_speed: 1.05
  duration_policy: Float32 max(0.05, raw_duration / max(speed, 0.05)); reject nonfinite/nonpositive
    requested speed
  frame_count_policy: truncate Float32(duration * 44100) toward zero; trim waveform
    to min(requested_frames, available_frames)
  latent_length_policy: ceil(requested_frames / 3072); reject outside 4..96; pass
    the full masked L96 state to the fixed vocoder and trim PCM
  ve_output_semantics: Updated latent including classifier-free guidance and Euler
    integration in HTP FP16; do not integrate again
  qualification_languages:
  - en
  - ko
  voices:
  - M1
  - F1
  supported_steps:
  - 8
  text_ids_dtype: int64
  noise_capacity: 128
  noise_policy: ChaCha8 as in MLSR, generate [1,144,128], crop each channel to true
    length and zero-pad to 96; replay accepts actual saved [1,144,128] Float32 noise
integrity:
  algorithm: sha256
  scope: Every listed payload including graph metadata and licenses. Keep all files
    immutable during engine lifetime.
