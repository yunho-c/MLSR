name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model-tools:
    name: Model manifest and reference tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install development-only model tool dependencies
        run: python -m pip install -r tools/supertonic3/requirements.txt
      - name: Check pinned YAML manifest and portable reference contracts
        run: python tools/dev.py test-model-tools

  native:
    name: Native bindings (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.11.1'
      - name: Check Rust, C, and all language bindings
        run: python tools/dev.py check
      - name: Test standalone Dart and Go packages with relocated native assets
        run: python tools/dev.py test-standalone
      - name: Install Python packaging tools
        run: python -m pip install "setuptools>=77" wheel
      - name: Test the installed Python wrapper
        run: python tools/dev.py package-python

  generated:
    name: Generated bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.11.1'
      - name: Install libclang
        run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - name: Verify the generated C and Dart files
        run: python tools/dev.py check-generated

  rust-minimum:
    name: Minimum supported Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: cargo +1.88.0 check --locked -p mlsr -p mlsr-ffi -p mlsr-cli --all-features

  coreml:
    name: Core ML (${{ matrix.rust }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, '1.88.0']
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      IPHONEOS_DEPLOYMENT_TARGET: '18.0'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-darwin
          components: clippy
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Lint the enabled backend
        if: matrix.rust == 'stable'
        run: cargo clippy --locked -p mlsr -p mlsr-ffi -p mlsr-cli --all-targets --all-features -- -D warnings
      - name: Test runtime, foreign callers, static/shared libraries, and Apple targets
        run: python tools/check_coreml.py --toolchain ${{ matrix.rust }} --cross
