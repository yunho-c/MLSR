[workspace]
members = ["crates/*", "tools/codegen"]
default-members = ["crates/mlsr", "crates/mlsr-ffi"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/yunho-c/MLSR"

[workspace.dependencies]
mlsr = { path = "crates/mlsr", version = "0.1.0" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
