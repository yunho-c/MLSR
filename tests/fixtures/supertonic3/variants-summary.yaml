limitations:
- The eight new fixed-vocoder probes are calibrated shape tests, not naturalness evaluations.
- Fixed vocoder errors are recorded in full reports and paired WAVs; bit-exact fusion
  does not imply fixed vocoder parity.
- Initialization and peak RSS include process order and OS specialization state; these
  single process samples do not rank general cold-start costs.
- One sequential process per variant cannot establish universal performance gains;
  per-case measurements are preserved.
- Retained sessions do not prove ANE residency. No W8A8/dense INT8 promotion or perceptual-quality
  claim.
