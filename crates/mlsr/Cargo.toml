[package]
name = "mlsr"
description = "A portable text-to-speech library implemented in Rust."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
coreml = ["dep:cidre"]
qnn = []
apple-output = ["dep:mlsr-playback", "mlsr-playback/apple"]
windows-output = ["dep:mlsr-playback", "mlsr-playback/wasapi"]

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
mlsr-playback = { path = "../mlsr-playback", optional = true }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
cidre = { workspace = true, optional = true }

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }
serde_yaml_ng = "=0.10.0"
sha2 = "=0.10.9"
# Match the capture's Unicode 15.0 normalization tables.
unicode-normalization = "=0.1.22"
unicode-segmentation = "=1.12.0"
rand_chacha = "=0.9.0"
rand_distr = "=0.5.1"
tempfile = "=3.27.0"
hound = "=3.5.1"

[target.'cfg(any(unix, windows))'.dependencies]
fs2 = "=0.4.3"

[[example]]
name = "coreml_replay"
required-features = ["coreml"]

[[example]]
name = "coreml_synthesis_replay"
required-features = ["coreml"]

[[example]]
name = "coreml_trace"
required-features = ["coreml"]

[[example]]
name = "qnn_synthesis_replay"
required-features = ["qnn"]

[[example]]
name = "qnn_qualification"
required-features = ["qnn"]

[[example]]
name = "coreml_ffi_probe"
crate-type = ["cdylib", "staticlib"]
required-features = ["coreml"]

[lints]
workspace = true
