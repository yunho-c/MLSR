[package]
name = "mlsr"
description = "A portable text-to-speech library implemented in Rust."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
coreml = ["dep:cidre"]

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
cidre = { workspace = true, optional = true }

[dev-dependencies]
serde_json = "=1.0.154"

[[example]]
name = "coreml_replay"
required-features = ["coreml"]

[[example]]
name = "coreml_ffi_probe"
crate-type = ["cdylib", "staticlib"]
required-features = ["coreml"]

[lints]
workspace = true
