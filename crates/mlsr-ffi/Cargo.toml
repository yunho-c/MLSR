[package]
name = "mlsr-ffi"
description = "The C ABI for MLSR."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "staticlib"]

[features]
default = []
coreml = ["mlsr/coreml"]
qnn = ["mlsr/qnn"]
apple-output = ["mlsr/apple-output"]

[dependencies]
mlsr.workspace = true
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[dev-dependencies]
tempfile = "=3.27.0"

[lints]
workspace = true
