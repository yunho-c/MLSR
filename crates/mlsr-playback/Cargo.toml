[package]
name = "mlsr-playback"
description = "Optional native audio output adapters for MLSR."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
apple = ["dep:objc2", "dep:block2", "dep:objc2-avf-audio", "dep:objc2-foundation"]
wasapi = ["dep:windows", "dep:windows-core"]

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "=0.62.2", optional = true, features = ["Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant"] }
windows-core = { version = "=0.62.2", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "=0.6.4", optional = true }
block2 = { version = "=0.6.2", optional = true }
objc2-foundation = { version = "=0.3.2", optional = true, default-features = false, features = ["std", "block2", "NSNotification", "NSOperation", "NSString"] }
objc2-avf-audio = { version = "=0.3.2", optional = true, default-features = false, features = [
    "std", "block2", "objc2-core-audio-types", "AVAudioEngine", "AVAudioNode",
    "AVAudioPlayerNode", "AVAudioBuffer", "AVAudioFormat", "AVAudioTime",
    "AVAudioTypes", "AVAudioMixerNode", "AVAudioMixing", "AVAudioUnit",
    "AVAudioUnitTimeEffect", "AVAudioUnitTimePitch",
] }

# The standalone spike still builds without opting the production library into
# output. These development dependencies do not enter headless MLSR builds.
[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2 = "=0.6.4"
block2 = "=0.6.2"
objc2-avf-audio = { version = "=0.3.2", default-features = false, features = [
    "std", "block2", "objc2-core-audio-types", "AVAudioEngine", "AVAudioNode",
    "AVAudioPlayerNode", "AVAudioBuffer", "AVAudioFormat", "AVAudioTime",
    "AVAudioTypes", "AVAudioMixerNode", "AVAudioMixing", "AVAudioUnit",
    "AVAudioUnitTimeEffect", "AVAudioUnitTimePitch",
] }

[dev-dependencies]
serde_json = "=1.0.154"

[lints]
workspace = true
