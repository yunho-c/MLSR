[package]
name = "mlsr-cli"
description = "Local text-to-WAV synthesis with MLSR"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
coreml = ["mlsr/coreml"]

[dependencies]
mlsr.workspace = true
clap = { version = "=4.6.7", features = ["derive"] }
hound = "=3.5.1"
tempfile = "=3.27.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_yaml_ng = "=0.10.0"
serde_json = "=1.0.154"
sha2 = "=0.10.9"

[target.'cfg(any(unix, windows))'.dependencies]
fs2 = "=0.4.3"

[[bin]]
name = "mlsr"
path = "src/main.rs"

[lints]
workspace = true
