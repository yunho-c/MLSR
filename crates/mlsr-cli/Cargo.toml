[package]
name = "mlsr-cli"
description = "Local text-to-WAV synthesis with MLSR"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
coreml = ["mlsr/coreml"]
qnn = ["mlsr/qnn"]

[dependencies]
mlsr.workspace = true
clap = { version = "=4.6.7", features = ["derive"] }
hound = "=3.5.1"
tempfile = "=3.27.0"

[[bin]]
name = "mlsr"
path = "src/main.rs"

[lints]
workspace = true
