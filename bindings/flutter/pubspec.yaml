name: mlsr_flutter
description: Flutter model discovery and delivery for the MLSR Rust TTS library.
version: 0.1.0
publish_to: none
repository: https://github.com/yunho-c/MLSR

environment:
  sdk: '>=3.11.0 <4.0.0'
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter
  mlsr:
    path: ../dart

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  crypto: ^3.0.7
  yaml: ^3.1.4

flutter:
  plugin:
    platforms:
      macos:
        pluginClass: MlsrFlutterPlugin
